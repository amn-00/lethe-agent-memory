[project]
name = "lethe"
version = "0.1.0"
description = "Long-horizon memory for LLM agents: retain, evict, reload, with retrieved-vs-used tracking."
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0",
    "fastembed>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lethe*"]

[tool.setuptools.package-data]
lethe = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
# long lines are mostly prompts and docstrings; wrapping them hurts more than it helps
ignore = ["E501"]
