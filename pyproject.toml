[project]
name = "lethe"
version = "0.1.0"
description = "Long-horizon memory for LLM agents: retain, evict, reload, with retrieved-vs-used tracking."
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0",
    "fastembed>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lethe*"]

[tool.pytest.ini_options]
pythonpath = ["."]